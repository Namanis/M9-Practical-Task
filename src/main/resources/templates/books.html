<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Library - Books</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css">
    <style>
        body { padding-top: 70px; }
    </style>
</head>
<body>

<div class="navbar navbar-inverse navbar-fixed-top">
    <div class="container">
        <div class="navbar-header">
            <a class="navbar-brand" th:href="@{/books}">Library</a>
        </div>
        <ul class="nav navbar-nav">
            <li class="active"><a th:href="@{/books}">Books</a></li>
            <li><a th:href="@{/external-books}">External books</a></li>
        </ul>
        <form class="navbar-form navbar-right" th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-default">Log out</button>
        </form>
    </div>
</div>

<div class="container">
    <h1>Books</h1>

    <div th:if="${message}" th:text="${message}" class="alert alert-success"></div>
    <div th:if="${error}" th:text="${error}" class="alert alert-danger"></div>

    <table class="table table-striped">
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Author</th>
            <th>Genre</th>
            <th>Year</th>
            <th>Status</th>
            <th>Action</th>
        </tr>
        <tr th:each="book : ${books}">
            <td th:text="${book.id}"></td>
            <td th:text="${book.title}"></td>
            <td th:text="${book.author}"></td>
            <td th:text="${book.genre}"></td>
            <td th:text="${book.publicationYear}"></td>
            <td th:text="${book.borrowedStatus}"></td>
            <td>
                <form th:action="@{/books/{id}/borrow(id=${book.id})}" method="post" style="display:inline">
                    <button type="submit" class="btn btn-primary btn-xs">Borrow</button>
                </form>
                <form th:action="@{/books/{id}/return(id=${book.id})}" method="post" style="display:inline">
                    <button type="submit" class="btn btn-primary btn-xs">Return</button>
                </form>
            </td>
        </tr>
    </table>
</div>
</body>
</html>
