<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="">
<head>
    <meta charset="UTF-8">
    <title>Library - Books</title>
</head>
<body>
<h1>Books</h1>

<p th:if="${message}" th:text="${message}" style="color: green"></p>
<p th:if="${error}" th:text="${error}" style="color: red"></p>

<table>
    <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Author</th>
        <th>Genre</th>
        <th>Year</th>
        <th>Status</th>
        <th>Action</th>
    </tr>
    <tr th:each="book : ${books}">
        <td th:text="${book.id}"></td>
        <td th:text="${book.title}"></td>
        <td th:text="${book.author}"></td>
        <td th:text="${book.genre}"></td>
        <td th:text="${book.publicationYear}"></td>
        <td th:text="${book.borrowedStatus}"></td>
        <td>
            <form th:action="@{/books/{id}/borrow(id=${book.id})}" method="post" style="display:inline">
                <button type="submit">Borrow</button>
            </form>
            <form th:action="@{/books/{id}/return(id=${book.id})}" method="post" style="display:inline">
                <button type="submit">Return</button>
            </form>
        </td>
    </tr>
</table>

<form th:action="@{/logout}" method="post">
    <button type="submit">Log out</button>
</form>
</body>
</html>
