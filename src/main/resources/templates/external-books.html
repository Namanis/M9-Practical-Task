<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="LT">
<head>
    <meta charset="UTF-8">
    <title>Library - External books</title>
</head>
<body>
<h1>External books</h1>

<h2>All external books</h2>

<table th:if="${books}">
    <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Author</th>
        <th>Genre</th>
        <th>Price</th>
        <th>ISBN</th>
        <th>Year</th>
    </tr>
    <tr th:each="b : ${books}">
        <td th:text="${b.id}"></td>
        <td th:text="${b.title}"></td>
        <td th:text="${b.author}"></td>
        <td th:text="${b.genre}"></td>
        <td th:text="${b.price}"></td>
        <td th:text="${b.isbn}"></td>
        <td th:text="${b.publishedYear}"></td>
    </tr>
</table>
</body>
</html>
